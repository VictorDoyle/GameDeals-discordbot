name: Post Game Deals (every 5 days)

on:
  schedule:
    # Run at 14:00 UTC every 5th day of the month
    - cron: "0 14 */5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Yarn
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build TypeScript
        run: yarn build

      - name: Post deals to Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          DEAL_LIMIT: ${{ vars.DEAL_LIMIT || '50' }}
          MIN_SAVINGS: ${{ vars.MIN_SAVINGS || '30' }}
          MAX_SAVINGS: ${{ vars.MAX_SAVINGS || '85' }}
          COUNTRY: ${{ vars.COUNTRY || 'US' }}
          SHOP_IDS: ${{ vars.SHOP_IDS || '61,35,6,3' }}
          DEDUPLICATION_DAYS: ${{ vars.DEDUPLICATION_DAYS || '7' }}
          REQUIRED_DRM_NAMES: ${{ vars.REQUIRED_DRM_NAMES || 'Steam' }}
          MIN_RATING: ${{ vars.MIN_RATING || '70' }}
          MIN_REVIEW_COUNT: ${{ vars.MIN_REVIEW_COUNT || '100' }}
          MIN_HOURS_UNTIL_EXPIRY: ${{ vars.MIN_HOURS_UNTIL_EXPIRY || '48' }}
        run: yarn start

      - name: Commit deal history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add deal-history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update deal history [skip ci]"
          git push
